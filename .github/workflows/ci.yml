name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main, claude/**]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version must not be older than the newest tag
        run: |
          newest="$(git tag --sort=-v:refname | head -1)"
          current="v$(node -p "require('./package.json').version")"
          [ -n "$newest" ] || exit 0
          if [ "$(printf '%s\n%s\n' "$newest" "$current" | sort -V | tail -1)" != "$current" ]; then
            echo "::error::package.json is $current but the newest tag is $newest — bump the version before merging"
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Dockerfile review on every PR, not only at tag time: the publish workflow
  # grades the image, this grades the recipe before an image exists.
  dockerfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: immanuwell/dockerfile-roast@1.7.0
        with:
          files: Dockerfile
