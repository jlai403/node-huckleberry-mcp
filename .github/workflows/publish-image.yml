name: Publish image

# Builds the streamable-HTTP image and pushes it to GHCR, tagged from the git
# tag. Dispatchable so a failed release can be rebuilt without moving the tag.
#
# Two tags per release: `vX.Y.Z` (immutable, the only tag built and the only
# one trivy grades) and `vX` (rolling inside that major line). The stack pins
# `vX`, so a 0.x release reaches the host on the next stack deploy with no
# compose edit; a `v1` will mean a breaking change and needs one. `latest`
# rides along.
#
# The rolling aliases are moved *after* the scan, by retagging the scanned
# digest: put them in the build's tag list instead and a CRITICAL image is
# `v0` for the half-minute until trivy fails the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag
        id: ref
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "tag must look like v1.2.3, got '$tag'" >&2
              exit 1
              ;;
          esac
          version="${tag#v}"
          case "$version" in
            *[!0-9A-Za-z.-]*)
              echo "unusable version '$version'" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.tag }}
          # Tags are the ranking used below.
          fetch-depth: 0
          persist-credentials: false

      # Floating tags move forward only. Rebuilding an old tag — or a release
      # redone after a failure — must not drag v0 or latest back to an older
      # image, which is the one way an alias becomes worse than no alias.
      - name: Decide whether the aliases may move
        id: aliases
        run: |
          tag="${{ steps.ref.outputs.tag }}"
          newest="$(git tag --sort=-v:refname | head -1)"
          echo "newest=$newest"
          if [ "$tag" = "$newest" ]; then
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          else
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint the Dockerfile
        uses: immanuwell/dockerfile-roast@1.7.0
        with:
          files: Dockerfile

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the image reference
        id: tags
        run: |
          # GHCR rejects uppercase in an image reference.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # The consuming host is x86_64; arm64 was ~10 minutes of QEMU per build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.image }}:${{ steps.ref.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the digest that was just pushed, so what is graded is exactly what
      # `docker pull` hands out. Run as a container rather than through the
      # action: the action's install step failed in CI (exit 6), and this is the
      # whole scan. Unfixed base-image CVEs are excluded — no action to take.
      - name: Scan the image
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.76.1 image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      # Registry-side retag of the digest the scan just graded: no rebuild, no
      # pull. This is the step that makes the stack's `v0` pin safe.
      - name: Move the rolling aliases
        if: steps.aliases.outputs.rolling == 'true'
        run: |
          image="${{ steps.tags.outputs.image }}"
          source="${image}:${{ steps.ref.outputs.version }}"
          for alias in "v${{ steps.ref.outputs.major }}" latest; do
            docker buildx imagetools create -t "${image}:${alias}" "${source}"
          done

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`ghcr.io/${{ github.repository }}\` |"
            echo "| version | \`${{ steps.ref.outputs.version }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| aliases | \`v${{ steps.ref.outputs.major }}\` + \`latest\` moved: \`${{ steps.aliases.outputs.rolling }}\` |"
            echo
            echo "GHCR packages are private by default: flip visibility, or give the consumer a pull token."
          } >> "$GITHUB_STEP_SUMMARY"
