name: Publish image

# Builds the streamable-HTTP image and pushes it to GHCR, tagged from the git
# tag. Dispatchable so a failed release can be rebuilt without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag
        id: ref
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "tag must look like v1.2.3, got '$tag'" >&2
              exit 1
              ;;
          esac
          version="${tag#v}"
          case "$version" in
            *[!0-9A-Za-z.-]*)
              echo "unusable version '$version'" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.tag }}
          # Tags are the ranking used below.
          fetch-depth: 0
          persist-credentials: false

      # Floating tags move forward only. Rebuilding an old tag — or a release
      # redone after a failure — must not drag :latest or :0.7 back to an older
      # image, which is the one way an alias becomes worse than no alias.
      - name: Decide which aliases may move
        id: aliases
        run: |
          tag="${{ steps.ref.outputs.tag }}"
          minor="${{ steps.ref.outputs.minor }}"
          newest="$(git tag --sort=-v:refname | head -1)"
          newest_minor="$(git tag --sort=-v:refname | grep -E "^v${minor//./\\.}\.[0-9]+$" | head -1)"
          echo "newest=$newest newest_minor=$newest_minor"
          if [ "$tag" = "$newest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$tag" = "$newest_minor" ]; then
            echo "minor=true" >> "$GITHUB_OUTPUT"
          else
            echo "minor=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint the Dockerfile
        uses: immanuwell/dockerfile-roast@1.7.0
        with:
          files: Dockerfile

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble tags
        id: tags
        run: |
          # GHCR rejects uppercase in an image reference.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "${image}:${{ steps.ref.outputs.version }}"
            if [ "${{ steps.aliases.outputs.minor }}" = "true" ]; then
              echo "${image}:${{ steps.ref.outputs.minor }}"
            fi
            if [ "${{ steps.aliases.outputs.latest }}" = "true" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the digest that was just pushed, so what is graded is exactly what
      # `docker pull` will hand out. Unfixed base-image CVEs are excluded: there
      # is no action to take on them here.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`ghcr.io/${{ github.repository }}\` |"
            echo "| version | \`${{ steps.ref.outputs.version }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| aliases | \`latest=${{ steps.aliases.outputs.latest }}\` \`${{ steps.ref.outputs.minor }}=${{ steps.aliases.outputs.minor }}\` |"
            echo
            echo "GHCR packages are private by default: flip visibility, or give the consumer a pull token."
          } >> "$GITHUB_STEP_SUMMARY"
